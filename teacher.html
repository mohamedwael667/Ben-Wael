    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة المدرس | منصة بن وائل التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f7fb;--card:#fff;--line:#e6e9f0;--text:#101828;--muted:#667085;--orange:#ea580c;--amber:#f59e0b;--grad:linear-gradient(135deg,#f59e0b,#ea580c);--shadow:0 10px 30px rgba(16,24,40,.08)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{text-decoration:none;color:inherit}
.container{max-width:1100px;margin:auto;padding:0 20px}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.logo img{width:46px;height:46px;object-fit:contain}
.logo b{background:var(--grad);-webkit-background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:900;font-size:14px;font-family:inherit;cursor:pointer;transition:.3s;border:none}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--amber);color:var(--orange)}
.btn-danger{background:#fff;border:1.5px solid #fecaca;color:#b91c1c}
.btn-danger:hover{background:#fef2f2}
main{padding:40px 0 70px;position:relative;z-index:1}
.welcome{display:flex;align-items:center;gap:22px;padding:32px;border-radius:26px;background:var(--grad);color:#fff;box-shadow:0 20px 50px rgba(234,88,12,.25);margin-bottom:26px;flex-wrap:wrap;position:relative;overflow:hidden}
.welcome::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:22px 22px}
.welcome>*{position:relative}
.avatar{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:900;color:var(--orange);background:#fff;flex-shrink:0}
.welcome h1{font-size:clamp(20px,3vw,28px);font-weight:900}
.welcome .muted{color:rgba(255,255,255,.85);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}
.stat i{font-size:24px;color:var(--orange);margin-bottom:10px;display:block}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{color:var(--muted);font-size:12px;font-weight:800}
.mgmt{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.mgmt a{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:.35s}
.mgmt a:hover{transform:translateY(-6px);border-color:var(--amber);box-shadow:0 15px 35px rgba(16,24,40,.1)}
.mgmt i{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:22px;color:#fff;background:var(--grad)}
.mgmt b{font-size:15px;font-weight:900}
.mgmt small{color:var(--muted);font-size:12px;font-weight:700}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.mgmt{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div class="container top-wrap">
    <a href="index.html" class="logo"><img src="logo.png" alt="بن وائل" onerror="this.style.display='none'"><span>منصة <b>بن وائل</b></span></a>
    <div class="top-actions">
      <a href="index.html" class="btn btn-ghost"><i class="fa-solid fa-house"></i> الرئيسية</a>
      <button id="logoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="welcome">
    <div class="avatar" id="avatar">…</div>
    <div>
      <h1 id="wName">ثواني…</h1>
      <p class="muted" id="wSub">لوحة تحكم المدرس — تدير مادتك بس</p>
    </div>
  </section>

  <div class="stats">
    <div class="stat"><i class="fa-solid fa-video"></i><b id="cLec">0</b><span>محاضراتي</span></div>
    <div class="stat"><i class="fa-solid fa-book-open"></i><b id="cSum">0</b><span>ملخصاتي</span></div>
    <div class="stat"><i class="fa-solid fa-file-pen"></i><b id="cQuiz">0</b><span>اختباراتي</span></div>
    <div class="stat"><i class="fa-solid fa-key"></i><b id="cUsed">0</b><span>أكواد مستخدمة</span></div>
  </div>

  <div class="mgmt">
    <a href="admin-lectures.html"><i class="fa-solid fa-video"></i><b>محاضراتي</b><small>إضافة + أكواد الوصول</small></a>
    <a href="admin-summaries.html"><i class="fa-solid fa-book-open"></i><b>ملخصاتي</b><small>ملخصات محمية</small></a>
    <a href="admin-quizzes.html"><i class="fa-solid fa-file-pen"></i><b>اختباراتي</b><small>أسئلة + تصحيح فوري</small></a>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  const $=id=>document.getElementById(id);
  auth.onAuthStateChanged(async user=>{
    if(!user){location.href='login.html';return;}
    let role='',name='';
    try{const s=await db.collection('profiles').doc(user.uid).get();if(s.exists){role=s.data().role||'';name=s.data().name||'';}}catch(e){}
    if(role!=='teacher'&&user.email!=='admin@academy.com'){location.href='dashboard.html';return;}
    $('avatar').textContent=(name||'م').charAt(0);
    $('wName').textContent='أهلاً، '+(name||'مدرس')+' 👋';
    try{
      const [lec,sum,quiz,codes]=await Promise.all([
        db.collection('lectures').where('teacherEmail','==',user.email).get(),
        db.collection('summaries').where('teacherEmail','==',user.email).get(),
        db.collection('quizzes').where('teacherEmail','==',user.email).get(),
        db.collection('lecture_codes').get()
      ]);
      let used=0;codes.forEach(c=>{if(c.data().usedBy)used++;});
      $('cLec').textContent=lec.size;$('cSum').textContent=sum.size;$('cQuiz').textContent=quiz.size;$('cUsed').textContent=used;
    }catch(e){}
  });
  $('logoutBtn').onclick=async()=>{localStorage.removeItem('bw_user');await auth.signOut();location.href='index.html';};
</script>
</body>
</html>
